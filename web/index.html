<!doctype html>
<html lang="ko">
<head>
<script>if (!location.pathname.endsWith('/') && !/\.[a-z0-9]+$/i.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Kitty Office</title>
<link rel="icon" href="data:,">
<link rel="manifest" href="manifest.json"> <!-- 브라우저 「앱으로 설치」 — 작업 표시줄에 고양이 아이콘으로 따로 뜬다 -->
<style>
  :root {
    --paper: #fbf5ea; --paper2: #f3e8d6; --ink: #3b2a1e; --muted: #8a7563; --line: #e4d4bd;
    --red: #e0452b; --red-soft: #fde4dc; --wood: #b98552; --green: #5c8a4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); background: var(--paper);
    display: grid; grid-template-rows: 48px 1fr; grid-template-columns: 100%;
    grid-template-areas: "top" "view"; overflow: hidden; /* 사무실 캔버스는 창 전체 폭 — 오른쪽 목록은 그 위에 떠 있는 패널(접어도 캔버스 크기가 안 바뀐다) */
  }
  /* 맨 위 띠 */
  #top { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 0 18px;
    background: #5a3d28; color: #fff3e0; }
  #top h1 { font-size: 17px; margin: 0; letter-spacing: -0.3px; }
  #top .obs { font-size: 13px; opacity: .8; }
  #top .conn { display: none; background: var(--red); color: #fff; font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 99px; }
  #top .conn.on { display: inline-block; }
  #top .topwait { margin-left: auto; font-size: 14px; font-weight: 700; }
  #top .topwait b.zero { background: #8a6a4a; }
  #top .find { position: relative; }
  #top .find input { width: 170px; font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 99px; border: 0;
    background: rgba(255,255,255,.14); color: #fff3e0; outline: none; }
  #top .find input::placeholder { color: rgba(255,243,224,.6); }
  #top .find input:focus { background: #fff; color: var(--ink); }
  #top #found { display: none; position: absolute; right: 0; top: 34px; width: 280px; max-height: 60vh; overflow-y: auto; margin: 0;
    padding: 4px; list-style: none; background: #fff; color: var(--ink); border-radius: 12px; box-shadow: 0 10px 30px rgba(60,30,10,.3); z-index: 200000; }
  #top #found.on { display: block; }
  #top #found li { padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; gap: 6px; align-items: center; }
  #top #found li.sel, #top #found li:hover { background: var(--paper2); }
  #top #found li i { font-style: normal; color: var(--muted); font-size: 12px; }
  #top #found li .st { margin-left: auto; font-size: 11px; font-weight: 700; }
  #top #found li .st.w { color: var(--red); }
  #top .bell { all: unset; cursor: pointer; font-size: 16px; padding: 2px 4px; border-radius: 8px; }
  #top .bell:hover { background: rgba(255,255,255,.12); }
  #top .topwait b { background: var(--red); color: #fff; padding: 2px 10px; border-radius: 99px; margin-left: 4px; }

  /* 불멍 — 머리줄·할 일·목록이 흐려져 숨고, 가장자리가 은은하게 어두워진다 */
  #top, #todoPane, #side { transition: opacity 200ms cubic-bezier(0.2, 0, 0, 1); }
  body.gaze #top, body.gaze #todoPane, body.gaze #side { opacity: 0; pointer-events: none; }
  body { transition: background-color 600ms; } body.gaze { background-color: #20140c; } /* 머리줄 자리도 어둡게 */
  #gazeUI { position: fixed; inset: 0; z-index: 45; pointer-events: none; opacity: 0; transition: opacity 600ms cubic-bezier(0.2, 0, 0, 1);
    background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 45%, rgba(25,12,4,.55) 100%); }
  body.gaze #gazeUI { opacity: 1; }
  #gazeUI button { pointer-events: auto; font: inherit; cursor: pointer; border: 0; border-radius: 99px; background: rgba(40,22,10,.55); color: #ffe9cf; padding: 8px 14px; font-size: 14px; font-weight: 700; }
  #gazeUI button:hover { background: rgba(40,22,10,.75); }
  #gazeUI .row { position: absolute; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  #gazeUI .wait { position: absolute; right: 18px; top: 18px; background: var(--red); color: #fff; }
  body:not(.gaze) #gazeUI button { pointer-events: none; }
  /* 머리줄 🔥 메뉴 — 불멍 · 낚시멍 */
  .mungw { position: relative; display: inline-flex; }
  #mungMenu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 300; display: flex; flex-direction: column; min-width: 128px; padding: 4px; border-radius: 12px; background: var(--paper); box-shadow: 0 6px 20px rgba(60,30,10,.25); }
  #mungMenu[hidden] { display: none; }
  #mungMenu button { all: unset; cursor: pointer; padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  #mungMenu button:hover, #mungMenu button:focus-visible { background: var(--paper2); }
  @media (max-width: 759px), (orientation: portrait) { #mungMenu button { min-height: 44px; box-sizing: border-box; display: flex; align-items: center; } }
  @media (prefers-reduced-motion: reduce) { #top, #todoPane, #side, #gazeUI { transition: none; } }
  /* 왼쪽 위 오늘 할 일 — 3D 사무실 위에 떠 있는 반투명 패널(PC). 휴대폰은 칩 하나 */
  #todoPane { position: fixed; left: 12px; top: 60px; z-index: 20; width: 240px; max-height: 50vh; display: flex; flex-direction: column;
    border-radius: 14px; background: rgba(251,245,234,.86); border: 1px solid rgba(228,212,189,.9); box-shadow: 0 6px 18px rgba(60,30,10,.12);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); overflow: hidden; }
  #todoPane .cap { display: flex; align-items: center; gap: 6px; padding: 8px 8px 6px 12px; font-size: 13px; font-weight: 800; color: var(--ink); }
  #todoPane .cap small { color: var(--muted); font-weight: 700; }
  #todoPane .fold { all: unset; cursor: pointer; margin-left: auto; padding: 0 6px; border-radius: 6px; font-size: 13px; color: var(--muted); }
  #todoPane .fold:hover { background: rgba(255,255,255,.7); }
  #todoPane.folded { width: auto; } #todoPane.folded .todos, #todoPane.folded .add { display: none; }
  #todoPane .todos { list-style: none; margin: 0; padding: 0 6px; overflow-y: auto; flex: 1; min-height: 0; }
  #todoPane li { display: flex; align-items: center; gap: 7px; padding: 5px 6px; border-radius: 8px; font-size: 13px; }
  #todoPane li:hover { background: rgba(255,255,255,.7); }
  #todoPane li input[type=checkbox] { width: 16px; height: 16px; accent-color: #3f8f5f; flex: none; cursor: pointer; margin: 0; }
  #todoPane li .tx { flex: 1; cursor: text; word-break: break-word; line-height: 1.35; }
  #todoPane li.done .tx { text-decoration: line-through; color: var(--muted); } #todoPane li.old .tx { color: var(--red); font-weight: 700; }
  #todoPane li.none .tx { color: var(--muted); cursor: default; font-size: 12px; }
  #todoPane li .ed { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; }
  #todoPane li .del { border: 0; background: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 0 2px; opacity: .5; } #todoPane li:hover .del { opacity: 1; }
  #todoPane .add { padding: 6px 8px 8px; } #todoPane .add input { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  #todoPane .chip { display: none; }
  .todos .grip { flex: none; cursor: grab; color: var(--muted); opacity: .45; font-size: 9px; letter-spacing: -2px; padding: 0; margin-right: -4px; touch-action: none; user-select: none; } .todos li:hover .grip { opacity: 1; }
  .todos li.drag { background: #fbf7f0; } .todos li.ghost { opacity: .35; }
  #todoPane .dt, #todoDlg .dt { flex: none; font-size: 11px; color: var(--muted); }
  #todoPane .lateh, #todoDlg .lateh { padding: 2px 4px; } #todoPane .lateh:hover, #todoDlg .lateh:hover { background: none; }
  .pastTgl { all: unset; cursor: pointer; font-size: 12px; font-weight: 700; color: #4f6b55; padding: 3px 6px; border-radius: 6px; } .pastTgl:hover { background: rgba(63,143,95,.12); }
  #todoPane li.dayh, #todoDlg li.dayh { font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 8px 0; min-height: 0; } #todoPane li.dayh:hover, #todoDlg li.dayh:hover { background: none; }
  .lateTgl { all: unset; cursor: pointer; font-size: 12px; font-weight: 700; color: #8a6a4a; padding: 3px 6px; border-radius: 6px; } .lateTgl:hover { background: rgba(138,106,74,.12); }
  #todoPane li.late, #todoDlg li.late { opacity: .85; }
  .today { flex: none; border: 1px solid #b9a68c; background: #fff; color: #5a3d28; border-radius: 99px; font: inherit; font-size: 11px; font-weight: 700; padding: 1px 7px; cursor: pointer; }

  /* 가운데 3D */
  #view { grid-area: view; position: relative; overflow: hidden;
    background: linear-gradient(180deg, #d9eef2 0%, #bfe0b4 45%, #8fbf78 100%); }
  #view canvas { display: block; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; } /* 이름표 z-index 가 폰 시트·구역 안내 위로 새지 않게 */
  .tag { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; white-space: nowrap; text-align: center;
    will-change: transform; }
  .tag .nm { display: inline-block; max-width: 88px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom;
    font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: rgba(255,250,242,.94);
    border: 1px solid #e2cfb3; color: var(--ink); box-shadow: 0 1px 3px rgba(80,50,20,.18); }
  .tag.waiting .nm { background: #fff; border-color: var(--red); }
  .tag.off { opacity: .5; }
  .tag .moon { display: block; margin: 1px auto 0; width: max-content; font-size: 14px; line-height: 1; }
  .tag.actor .nm, .tag.actor .wt { pointer-events: auto; cursor: pointer; }
  /* 말풍선 — 이름표 위, 결재 대기 빨강보다 눈에 덜 띄게 */
  .sayb { position: absolute; left: 0; top: 0; max-width: 168px; width: max-content; padding: 4px 9px; border-radius: 12px; background: #fffaf2;
    border: 1.5px solid #a08a74; color: var(--ink); font-size: 11.5px; font-weight: 600; line-height: 1.35; text-align: center;
    white-space: normal; word-break: keep-all; pointer-events: none; box-shadow: 0 2px 6px rgba(80,50,20,.16); animation: sayIn .25s ease-out; transition: opacity .4s; }
  .sayb::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 8px; height: 8px; margin-left: -5px; background: #fffaf2;
    border-right: 1.5px solid #a08a74; border-bottom: 1.5px solid #a08a74; transform: rotate(45deg); }
  .sayb.out { opacity: 0; }
  #perchSay { position: fixed; z-index: 400002; display: none; } /* 팝업 고양이 말풍선 — 고양이 오른쪽, 꼬리는 왼쪽 */
  #perchSay::after { left: -5px; bottom: auto; top: 50%; margin: -4px 0 0; transform: rotate(135deg); }
  @keyframes sayIn { from { opacity: 0; } }
  .tag .wt { display: inline-block; vertical-align: bottom; margin: 0 0 0 3px; /* 발밑 이름표 — 이름 옆에 한 줄로(결재 줄 뒷사람 이름표가 앞사람 몸을 덜 가리게) */ width: max-content; font-size: 12px; font-weight: 800; color: #fff;
    background: var(--red); border-radius: 99px; padding: 1px 8px; }
  .drop { display: inline-block; width: 7px; height: 7px; margin-left: 3px; background: #7cc7ff;
    border-radius: 0 50% 50% 50%; transform: rotate(45deg); box-shadow: inset -1px -1px 0 rgba(0,0,0,.15); }
  .tag .bub { display: block; margin: 3px auto 0; width: max-content; max-width: 120px; overflow: hidden; text-overflow: ellipsis;
    font-size: 11px; background: #fff; border: 1.5px solid #5a3d28; border-radius: 10px; padding: 2px 8px; position: relative; }
  .tag.prop .nm { font-size: 13px; padding: 3px 10px; background: #5a3d28; color: #fff3e0; border-color: #5a3d28; max-width: none; }
  .tag.prop.hot .nm { background: var(--red); border-color: var(--red); }
  .tag.prop.blue .nm { background: #3f6fa8; border-color: #3f6fa8; }
  .tag.prop.big .nm { font-size: 14px; padding: 4px 12px; }
  .tag.more .nm { background: #5a3d28; color: #fff; border-color: #5a3d28; font-size: 12px; }

  /* 오른쪽 패널 */
  #side { position: fixed; top: 48px; right: 0; bottom: 0; width: var(--side-w, 480px); z-index: 30; background: var(--paper); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: visible; min-height: 0; transition: transform 200ms cubic-bezier(0.2, 0, 0, 1); }
  #side > .pane { overflow-x: hidden; }
  #sideGrip { position: absolute; top: 0; bottom: 0; left: -4px; width: 8px; cursor: col-resize; z-index: 5; }
  #sideGrip:hover, #sideGrip.on { background: rgba(90,61,40,.18); }
  #sheetGrip { display: none; }
  /* 오른쪽 목록 접기(PC 만) — 목록 왼쪽 가장자리의 작은 손잡이. 접으면 화면 오른쪽 끝 탭으로 남고 결재 기다림 수를 보인다 */
  #sideFold { position: absolute; z-index: 40; top: 16px; right: 100%; width: 22px; min-height: 44px; padding: 6px 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px solid var(--line); border-right: 0;
    border-radius: 10px 0 0 10px; background: var(--paper); color: var(--muted); font: inherit; font-size: 13px; font-weight: 800; cursor: pointer;
    box-shadow: -2px 2px 6px rgba(80,50,20,.12); }
  #sideFold:hover { color: var(--ink); }
  #sideFold b { display: none; font-size: 11px; color: #fff; background: var(--red); border-radius: 99px; padding: 1px 5px; }
  body.side-fold #sideFold b:not(.zero) { display: block; }
  body.side-fold #side { transform: translateX(100%); } /* 손잡이(#sideFold)는 패널 바깥 왼쪽에 붙어 있어 같이 밀려 화면 오른쪽 끝에 남는다 */
  #side.drag-w { transition: none; }
  @media (prefers-reduced-motion: reduce) { #side { transition: none; } }
  /* 탭 — 위 큰 탭 둘(현재·활동 로그), 「현재」 안에 상태 탭 다섯. 상태 탭 글자색 = 묶음 색 */
  #stabs { flex: none; display: flex; flex-wrap: wrap; gap: 2px; padding: 10px 10px 8px; } /* 좁으면 두 줄로 — 숨는 탭이 없게 */
  #stabs button { all: unset; cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 700; color: var(--c);
    padding: 5px 7px; border: 1.5px solid transparent; border-radius: 99px; }
  #stabs button b { font-weight: 800; margin-left: 2px; }
  #stabs button.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, #fff); }
  .all { --c: var(--ink); } .wait { --c: var(--red); } .rep { --c: #3d6fb5; } .work { --c: #3f8f5f; } .off { --c: #9a8f84; } .done { --c: #7a5ea8; }
  #side .pane { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 12px; }
  /* 「현재」 — 내가 처리할 것(결재·보고) 먼저, 그다음 일하는 중(섬별)·쉬는 중·퇴근 상자 */
  .box { border: 2px solid var(--c); border-radius: 14px; padding: 10px 12px 6px; margin: 0 0 12px; background: #fff; }
  .box:first-child { margin-top: 12px; } /* 현재·활동 로그 탭과 첫 상자 사이 */
  .box > h4 { margin: 0 0 4px; font-size: 14px; color: var(--c); display: flex; align-items: baseline; gap: 6px; }
  .box > h4 small { font-size: 11px; font-weight: 500; color: var(--muted); }
  .box.todo { --c: var(--red); } .box.work { --c: #3f8f5f; } .box.off { --c: #9a8f84; } .box.done { --c: #7a5cb0; } .box.pin { --c: #c89a2e; }
  .wl .grip { cursor: grab; color: #b9a68c; margin-right: 6px; touch-action: none; user-select: none; font-size: 15px; }
  .wl li.dragging { opacity: .55; background: #fff6e0; } .box.mine { --c: #3d5a8a; }
  .box .zone { border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); border-radius: 10px; padding: 6px 8px; margin: 6px 0; }
  .box .zone > div { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 0 6px; }
  .chip { font-size: 12px; border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); background: color-mix(in srgb, var(--c) 8%, #fff);
    border-radius: 99px; padding: 3px 9px; cursor: pointer; }
  .chip i { font-style: normal; color: var(--muted); margin-left: 4px; }
  .box .empty { padding: 4px 0 8px; }
  .wl { list-style: none; margin: 0; padding: 0; }
  .wl li { border-top: 1px dashed var(--line); padding: 9px 2px; cursor: pointer; }
  .wl li:hover { background: #fff8f4; }
  .wl .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .wl .sn { color: var(--c); font-size: 12px; font-weight: 700; white-space: nowrap; }
  .wl li:not(.wait) .r1 .t { color: var(--muted); font-weight: 600; }
  .wl .r1 { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .wl .r1 b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .wl .r1 .fl { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .wl .r1 .t { margin-left: auto; font-weight: 800; color: var(--red); white-space: nowrap; }
  .wl .stale-tag { font-size: 11px; font-weight: 700; color: #fff; background: #8a6a4a; border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  .wl li.stale .r1 .t { color: #8a6a4a; }
  .wl .q { font-size: 12px; color: var(--muted); margin-top: 3px; overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 1; -webkit-box-orient: vertical; line-height: 1.45; word-break: break-all; }
  /* 기다림 전체 메시지 팝업 */
  #msg { width: min(720px, 90vw); max-height: 80vh; padding: 0; border: 2px solid var(--red); border-radius: 16px;
    background: #fff; color: var(--ink); box-shadow: 0 20px 60px rgba(60,30,10,.35); }
  /* 클로즈업한 캐릭터가 안 가리게 오른쪽에 붙인다 */
  #msg { position: fixed; z-index: 400000; margin: 0; inset: 60px 16px auto auto; width: min(702px, 57vw); max-height: calc(100vh - 76px); }
  /* PC 는 이름 줄을 끌어 옮기고 오른쪽 아래 모서리로 크기를 바꾼다(자리는 JS placeMsg 가 left/top 으로) */
  @media (min-width: 760px) and (orientation: landscape) {
    #msg { resize: both; min-width: 440px; max-width: calc(100vw - 16px); }
    #msg.sized { min-height: 360px; } /* 키운 창 — 입력칸 6줄·버튼 줄이 들어갈 만큼 */
    #msg header { cursor: move; user-select: none; } #msg header button { cursor: pointer; }
  }
  #set, #logDlg { width: min(380px, 92vw); padding: 0; border: 0; border-radius: 16px; background: #fff; color: var(--ink); box-shadow: 0 20px 60px rgba(60,30,10,.35); }
  /* 오늘 할 일 창 — 설정 창과 같은 모양. 휴대폰은 전체 화면 */
  #todoDlg, #boardDlg { width: min(420px, 92vw); max-height: 80vh; padding: 0; border: 0; border-radius: 16px; background: #fff; color: var(--ink); box-shadow: 0 20px 60px rgba(60,30,10,.35); }
  #todoDlg[open], #boardDlg[open] { display: flex; flex-direction: column; }
  #todoDlg::backdrop, #boardDlg::backdrop { background: rgba(40,25,10,.35); }
  #todoDlg header, #boardDlg header { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px dashed var(--line); }
  #todoDlg header b, #boardDlg header b { font-size: 16px; } #todoDlg header .cnt, #boardDlg header .cnt { flex: 1; color: var(--muted); font-size: 13px; font-weight: 700; }
